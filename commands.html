<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commands - ZMN</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131926; --primary-cyan: #00bfff; --text-main: #ffffff; --text-muted: #8f9cae; --border-color: #1e293b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border-color); }
        nav { display: flex; gap: 25px; }
        nav a { color: var(--text-muted); text-decoration: none; }
        nav a.active { color: var(--primary-cyan); }
        
        .container { max-width: 900px; margin: 60px auto; padding: 20px; }
        .search-box { width: 100%; padding: 15px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 30px; }
        
        .cmd-row { display: flex; justify-content: space-between; background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 15px 20px; border-radius: 8px; margin-bottom: 12px; }
        .cmd-name { color: var(--primary-cyan); font-weight: bold; font-family: monospace; }
        .cmd-desc { color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" style="color:#fff; text-decoration:none;" class="logo-text">ZMN</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="commands.html" class="active">Commands</a>
            <a href="premium.html">Premium</a>
        </nav>
    </header>

    <div class="container">
        <input type="text" class="search-box" placeholder="Search commands...">
        
        <div class="cmd-row"><span class="cmd-name">/ban</span><span class="cmd-desc">Ban a member with custom duration and reason</span></div>
        <div class="cmd-row"><span class="cmd-name">/kick</span><span class="cmd-desc">Kick a user instantly from the server</span></div>
        <div class="cmd-row"><span class="cmd-name">/mute</span><span class="cmd-desc">Mute a member across all text and voice channels</span></div>
        <div class="cmd-row"><span class="cmd-name">/unmute</span><span class="cmd-desc">Restore a previously muted member's permissions</span></div>
    </div>

</body>
</html>
