<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ZMN</title>
    <link rel="icon" type="image/png" href="https://zmn.sa/assets/logo.png">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131926;
            --primary-cyan: #00bfff;
            --text-main: #ffffff;
            --text-muted: #8f9cae;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); text-align: center; padding-bottom: 50px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border-color); }
        .logo-text { font-size: 24px; font-weight: 800; color: #fff; text-decoration: none; }
        nav { display: flex; gap: 25px; }
        nav a { color: var(--text-muted); text-decoration: none; }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; display: none; }
        
        .container { max-width: 1000px; margin: 60px auto; padding: 20px; }
        h1 { font-size: 3rem; color: #fff; margin-bottom: 10px; font-weight: 800; }
        .subtitle { color: var(--text-muted); margin-bottom: 40px; font-size: 1.1rem; }
        
        .login-box { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 50px 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-box h2 { font-size: 1.8rem; margin-bottom: 15px; }
        .login-box p { color: var(--text-muted); margin-bottom: 30px; }
        
        .btn-discord { background-color: var(--primary-cyan); color: #000; padding: 12px 35px; border-radius: 8px; font-weight: bold; text-decoration: none; display: inline-block; font-size: 1.05rem; transition: 0.3s; cursor: pointer; }
        .btn-discord:hover { box-shadow: 0 0 15px rgba(0, 191, 255, 0.5); }

        /* شبكة السيرفرات */
        .servers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; margin-top: 20px; display: none; }
        .server-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; text-align: center; transition: 0.3s; }
        .server-card:hover { transform: translateY(-5px); border-color: var(--primary-cyan); }
        .server-icon { width: 70px; height: 70px; border-radius: 50%; background-color: #2f3136; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: #fff; background-size: cover; }
        .server-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-setup { background-color: transparent; color: var(--primary-cyan); border: 1px solid var(--primary-cyan); padding: 8px 20px; border-radius: 6px; font-weight: bold; text-decoration: none; display: block; font-size: 0.9rem; transition: 0.3s; }
        .btn-setup:hover { background-color: var(--primary-cyan); color: #000; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-text">ZMN</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="commands.html">Commands</a>
            <a href="premium.html">Premium</a>
        </nav>
        <div class="user-info">
            <img id="avatar" class="user-avatar" src="" alt="Avatar">
            <span id="username"></span>
        </div>
    </header>

    <div class="container">
        <h1>Your Servers</h1>
        <p class="subtitle" id="page-subtitle">Select a server to get started.</p>
        
        <div class="login-box" id="auth-box">
            <h2>Please Log In</h2>
            <p>You need to log in to view your servers.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1524768461526663249&response_type=token&redirect_uri=https%3A%2F%2Fzmn-h5yy7e4qo-khaledmusaed2122kbs-ais-projects.vercel.app%2Fdashboard.html&scope=identify+guilds" class="btn-discord">Login</a>
        </div>

        <div class="servers-grid" id="servers-container"></div>
    </div>

    <script>
        // دالة قراءة التوكن ومعلومات الحساب من الرابط تلقائياً
        function getFragmentParams() {
            const hash = window.location.hash.substring(1);
            const params = {};
            if (hash) {
                hash.split('&').forEach(hk => {
                    const temp = hk.split('=');
                    params[temp[0]] = temp[1];
                });
            }
            return params;
        }

        const params = getFragmentParams();
        const token = params.access_token;

        if (token) {
            // إخفاء صندوق الـ Login وإظهار شبكة السيرفرات
            document.getElementById('auth-box').style.display = 'none';
            const serversContainer = document.getElementById('servers-container');
            serversContainer.style.display = 'grid';

            // جلب بيانات المستخدم الحالية (الاسم والصورة)
            fetch('https://discord.com/api/users/@me', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(user => {
                if(user.username) {
                    document.getElementById('username').innerText = user.username;
                    if(user.avatar) {
                        const avatarImg = document.getElementById('avatar');
                        avatarImg.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                        avatarImg.style.display = 'block';
                    }
                }
            });

            // جلب وقراءة السيرفرات وتصفيتها فقط لمن يملك رتبة إدارة Administrator
            fetch('https://discord.com/api/users/@me/guilds', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(guilds => {
                if (Array.isArray(guilds)) {
                    // تصفية السيرفرات بصلاحية الـ Administrator (قيمة الصلاحية البرمجية 0x8)
                    const adminGuilds = guilds.filter(g => (g.permissions & 0x8) === 0x8);
                    
                    if(adminGuilds.length === 0) {
                        document.getElementById('page-subtitle').innerText = "لا توجد سيرفرات تمتلك فيها صلاحيات إدارة.";
                        return;
                    }

                    adminGuilds.forEach(guild => {
                        const card = document.createElement('div');
                        card.className = 'server-card';
                        
                        let iconHtml = '';
                        if(guild.icon) {
                            const iconUrl = `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png`;
                            iconHtml = `<div class="server-icon" style="background-image: url('${iconUrl}')"></div>`;
                        } else {
                            const shortName = guild.name.split(' ').map(n => n[0]).join('').substring(0, 3);
                            iconHtml = `<div class="server-icon">${shortName}</div>`;
                        }

                        card.innerHTML = `
                            ${iconHtml}
                            <div class="server-name" title="${guild.name}">${guild.name}</div>
                            <a href="https://discord.com/oauth2/authorize?client_id=1524768461526663249&permissions=8&scope=bot+applications.commands&guild_id=${guild.id}" target="_blank" class="btn-setup">Setup</a>
                        `;
                        serversContainer.appendChild(card);
                    });
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('page-subtitle').innerText = "حدث خطأ أثناء جلب السيرفرات.";
            });
        }
    </script>
</body>
</html>
