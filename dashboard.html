<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ZMN</title>
    <link rel="icon" type="image/png" href="https://zmn.sa/assets/logo.png">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131926;
            --primary-cyan: #00bfff;
            --text-main: #ffffff;
            --text-muted: #8f9cae;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); text-align: center; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--border-color); }
        .logo-text { font-size: 24px; font-weight: 800; color: #fff; text-decoration: none; }
        nav { display: flex; gap: 25px; }
        nav a { color: var(--text-muted); text-decoration: none; }
        
        .container { max-width: 800px; margin: 80px auto; padding: 20px; }
        h1 { font-size: 3rem; color: #fff; margin-bottom: 10px; font-weight: 800; }
        .subtitle { color: var(--text-muted); margin-bottom: 40px; font-size: 1.1rem; }
        
        .login-box { background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 50px 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-box h2 { font-size: 1.8rem; margin-bottom: 15px; }
        .login-box p { color: var(--text-muted); margin-bottom: 30px; }
        
        .btn-discord { background-color: var(--primary-cyan); color: #000; padding: 12px 35px; border-radius: 8px; font-weight: bold; text-decoration: none; display: inline-block; font-size: 1.05rem; transition: 0.3s; }
        .btn-discord:hover { box-shadow: 0 0 15px rgba(0, 191, 255, 0.5); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-text">ZMN</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="commands.html">Commands</a>
            <a href="premium.html">Premium</a>
        </nav>
    </header>

    <div class="container">
        <h1>Your Servers</h1>
        <p class="subtitle">Select a server to get started.</p>
        
        <div class="login-box">
            <h2>Please Log In</h2>
            <p>You need to log in to view your servers.</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1524768461526663249&response_type=code&redirect_uri=https%3A%2F%2Fzmn-h5yy7e4qo-khaledmusaed2122kbs-ais-projects.vercel.app%2Fdashboard.html&scope=identify+guilds" class="btn-discord">Login</a>
        </div>
    </div>

</body>
</html>
